# Project-wide Gradle settings for the Flutter Android build.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Required by the Flutter Gradle plugin on AGP 9.x.
android.newDsl=false
android.builtInKotlin=false

# The Kotlin incremental compiler cannot close its cache files on Windows,
# failing the build with "Could not close incremental caches". Disabling
# incremental compilation sidesteps it at a small cost in rebuild time.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false