name: multi_task_calculator
description: A new Flutter application.

publish_to: 'none'

version: 1.1.0+1

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.0.9
  in_app_purchase: ^1.0.9
  share: ^2.0.1
  flutter_email_sender: ^5.0.0
  permission_handler: ^8.3.0
  provider: ^6.0.1
  shared_preferences: ^2.0.5
  #page_transition is not null safety
  page_transition: ^2.0.4
  cloud_firestore: ^3.1.0
  firebase_core: ^1.0.4
  google_mobile_ads: ^1.0.0
  package_info: ^2.0.0
  pub_semver: ^2.0.0
  font_awesome_flutter: ^9.0.0
  #used to solve mathematical expression
  function_tree: ^0.8.12
  dio: ^4.0.0
  flutter_holo_date_picker: ^1.0.1+2
  #unit_convert: ^0.1.3
  units_converter: ^1.1.1
  another_flushbar: ^1.10.24
  flutter_native_splash: ^1.2.1

  cupertino_icons: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Audiowide
      fonts:
        - asset: fonts/Audiowide-Regular.ttf
