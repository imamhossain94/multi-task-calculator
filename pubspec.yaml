name: multi_task_calculator
description: "Multi-Task Calculator — a fast, offline, all-in-one calculator app for Android and iOS."
publish_to: "none"

version: 1.2.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Platform / system
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  flutter_email_sender: ^10.0.1
  # Pinned below 13.x: permission_handler_android 13+ requires compileSdk 37,
  # while the Flutter/AGP toolchain this project targets compiles against 36.
  # Nothing in the app uses a permission introduced after 12.x.
  permission_handler: ">=12.0.0 <13.0.0"
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1

  # State / navigation / theming
  provider: ^6.1.5
  page_transition: ^2.2.2
  another_flushbar: ^2.2.4

  # Ads
  # Calculation engines
  function_tree: ^0.9.1
  units_converter: ^3.3.2
  pub_semver: ^2.2.1

  # Networking
  dio: ^5.11.1

  # UI
  font_awesome_flutter: ^11.0.0
  flutter_holo_date_picker: ^2.0.0
  cupertino_icons: ^1.0.9
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

# `platform` 3.0.x still calls `io.Platform.packageRoot`, which was removed in
# Dart 3.9. Every dependency that pulls it in only needs the parts added in
# 3.1.0, so force the newer release.
#
# `permission_handler_android` 13+ demands compileSdk 37, but AGP 9.0.1 (the
# version Flutter 3.44 targets) tops out at 36. 12.x is API-compatible with
# everything this app uses.
dependency_overrides:
  platform: ^3.1.6
  permission_handler_android: ">=12.0.0 <13.0.0"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Audiowide
      fonts:
        - asset: fonts/Audiowide-Regular.ttf

flutter_native_splash:
  color: "#E3EBEC"
  image: assets/images/ic_launcher_light.png
  color_dark: "#212230"
  image_dark: assets/images/ic_launcher_light.png
  android_gravity: center
  fullscreen: true
