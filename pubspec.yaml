name: multi_task_calculator
description: A new Flutter application.

publish_to: 'none'

version: 1.0.2

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.0.3
  in_app_purchase: ^0.5.2
  share: ^2.0.1
  flutter_email_sender: ^5.0.0
  permission_handler: ^6.1.1
  provider: ^5.0.0
  shared_preferences: ^2.0.5
  #page_transition is not null safety
  page_transition: ^1.1.7+6
  cloud_firestore: ^1.0.6
  firebase_core: ^1.0.4
  google_mobile_ads: ^0.12.1+1
  package_info: ^2.0.0
  pub_semver: ^2.0.0
  font_awesome_flutter: ^9.0.0
  #used to solve mathematical expression
  function_tree: ^0.8.12
  dio: ^4.0.0
  flutter_holo_date_picker: ^0.3.4+1
  #unit_convert: ^0.1.3
  units_converter: ^0.3.0

  cupertino_icons: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Audiowide
      fonts:
        - asset: fonts/Audiowide-Regular.ttf
